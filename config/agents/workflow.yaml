{
  "version": 1,
  "workflow": {
    "entry": "github_issue",
    "sequence": ["cto", "worker", "reviewer", "cto"],
    "completion_gate": "cto",
    "execution": "sequential",
    "context_policy": {
      "preserve": ["issue", "objective_ids", "acceptance_checks", "evidence", "review_findings"],
      "reset_per_role": ["system_prompt", "allowed_tools", "owned_paths", "skills"],
      "exclude": ["hidden_reasoning", "unrelated_user_data", "secrets"]
    }
  },
  "roles": {
    "cto": {
      "label": "CTO",
      "contract": ".agents/workflows/cto-workflow.md",
      "skills": ["subagent-orchestration", "git", "bapxphp-cli"],
      "tools": ["handoff-next", "handoff-score", "github-actions"],
      "owns": ["scope", "objective-registry", "handoff", "acceptance", "merge"],
      "may_edit": false
    },
    "worker": {
      "label": "Worker",
      "contract": ".agents/workflows/worker.md",
      "skills": ["backend-json", "frontend-php", "admin-ui", "schema", "docs"],
      "tools": ["bapxphp-map", "bapxphp-schema", "bapxphp-ci"],
      "owns": ["one-assigned-objective", "implementation-evidence"],
      "may_edit": true
    },
    "reviewer": {
      "label": "Reviewer",
      "contract": ".agents/workflows/reviewer.md",
      "skills": ["git", "bapxphp-cli"],
      "tools": ["diff-review", "bapxphp-ci", "coderabbit"],
      "owns": ["independent-verification", "findings", "objective-verdict"],
      "may_edit": false
    },

  },
  "events": {
    "github_issue": {
      "label": "Issue opened or @bapXai mentioned",
      "source": ".github/workflows/issue-comment-handoff.yml"
    },
    "branch_push": {
      "label": "Implementation branch pushed",
      "source": ".github/workflows/branch-pr.yml"
    },
    "pull_request": {
      "label": "Pull request updated",
      "source": ".github/workflows/ci.yml"
    },
    "deployment": {
      "label": "Deployment main merged",
      "source": "docs/deployment-hostinger.md"
    }
  },
  "scripts": {
    "map": {
      "label": "Generate and validate maps",
      "command": "bapXphp update",
      "success": "reviewer",
      "failure": "worker"
    },
    "ci": {
      "label": "Lint, tests, maps, smoke",
      "command": "bapXphp ci",
      "success": "reviewer",
      "failure": "worker"
    },
    "score": {
      "label": "Score handoff evidence",
      "command": "bapXphp handoff score <issue>",
      "success": "pull_request",
      "failure": "cto"
    },

  },
  "edges": [
    {"from": "github_issue", "to": "cto", "label": "scope"},
    {"from": "cto", "to": "worker", "label": "one objective"},
    {"from": "worker", "to": "ci", "label": "deterministic checks"},
    {"from": "ci", "to": "reviewer", "label": "evidence"},
    {"from": "reviewer", "to": "cto", "label": "pass"},
    {"from": "reviewer", "to": "worker", "label": "gap or blocked"},
    {"from": "cto", "to": "score", "label": "acceptance"},
    {"from": "score", "to": "pull_request", "label": "score >= gate"},
    {"from": "pull_request", "to": "deployment", "label": "merge"},
    {"from": "deployment", "to": "cto", "label": "live verification"}
  ],
  "telemetry": {
    "required": [
      "started",
      "completed",
      "duration_minutes",
      "total_issues",
      "closed_issues",
      "objectives_completed",
      "handoffs_used",
      "tests_passed",
      "gaps",
      "errors",
      "score"
    ],
    "minimum_score": 90
  }
}
