format: "bapx-project-knowledge-index"
version: "1.0"
generated_by: "cli/generate-okf-bundle.php"
authoritative_sources:
  runtime_data: "Hosted MySQL via DatabaseService; config/database.php selects direct PDO or configured BAPX_REMOTE_DB_URL (default APP_URL/remotedb)"
  schema: "storage/schema/collections.php"
  blogs: "content/blog/posts/*.md"
  operator_help: "content/help/admin/*.md through AdminHelpService allowlists"
  developer_instructions: "AGENTS.md and .agents/skills/*/SKILL.md"
  runtime_instructions: ".bapX/ via AgentInstructionService role allowlists"
  images: "assets/images/**/*"
  code_map: "map.mmd"
  documentation_map: "docs/map.mmd"
rules:
  - "Concepts are original project resources; this index never copies blog bodies or runtime records."
  - "Editable business records come from the configured client database through DatabaseService; the remote bridge is a conditional transport."
  - "Generated developer knowledge is deployment-neutral; never embed resolved client configuration or runtime records."
  - "Blog Markdown and image binaries remain local files."
  - "Read discovery first; query only the relevant section or resource. Do not load this entire index into agent context."
  - "Use at most three discovery hops: entry instructions, exact index match, original source. Avoid broad listings and recursive scans unless the target is absent."
  - "Code relationships are declared associations or bounded static references, not a runtime call graph. Follow docs/project-index.json relationship_provenance and original source before inferring behavior."
discovery:
  - question: "Which controller, view and services handle a route?"
    use: "docs/project-index.json: select by HTTP method and exact route pattern"
  - question: "Does a controller, service, view or collection exist?"
    use: "docs/project-index.json"
  - question: "How are routes, controllers, services and collections connected?"
    use: "map.mmd"
  - question: "What is the live product, category, consultant, temple or admin-editable value?"
    use: "DatabaseService and deployment-local config/database.php; authorized direct or configured /remotedb access"
  - question: "Where is a blog article and what frontmatter does it declare?"
    use: "concepts filtered by type=blog, then read its resource"
  - question: "Where is an image and which source files reference it?"
    use: "concepts filtered by type=image; query by filename or resource"
  - question: "What repository instructions or skill apply?"
    use: "AGENTS.md, then the matching .agents/skills/<name>/SKILL.md"
  - question: "Which operator guide explains this admin task?"
    use: "operator_guide metadata then original allowlisted content/help/admin source; not runtime-agent instructions"
  - question: "Which live business-agent instruction file applies?"
    use: "runtime_instruction references under .bapX; PHP role checks determine what can actually load"
query_examples:
  - "sed -n '1,/^concepts:/p' index.yaml"
  - "jq --arg method POST --arg path /contact '.routes[] | select(.method == $method and .path == $path)' docs/project-index.json"
  - "rg -n -A14 '^  - id: \"route:post__contact\"$' index.yaml"
  - "rg -n -A12 '^  - id: \"blog:create-account\"$' index.yaml"
  - "rg -n -F -B4 -A12 'filename: \"<name>\"' index.yaml"
  - "rg -n -A12 '^  - id: \"skill:docs\"$' index.yaml"
