name: Refresh reviewable generated artifacts for PR 345
on:
  push:
    branches: [fix/support-inline-enquiry-webmcp-20261123]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, pdo_mysql
      - name: Generate on final source state and remove this single-use workflow
        run: |
          git rm .github/workflows/bapx-pr345-refresh.yml
          ./bapXphp update
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'app/bootstrap.php';
          require 'cli/lib/DocumentationReview.php';
          $review=new DocumentationReview(getcwd(),require 'config/documentation.php');
          $notes=[
            'operator-help'=>'Reviewed the existing public contact form and help dependencies: Support embeds the same /contact form, and no owner guide, admin action or contact submission semantics are expanded.',
            'remote-commerce'=>'Checked shared shopping script and native Support coexistence: the new enquiry pane is separate from shopping and does not modify cart, payment, checkout, recovery or owner credentials.',
            'public-mcp'=>'Reviewed public MCP and WebMCP contract guidance: the real shop GET filter is declarative and read-only; contact POST requires explicit Send and neither form modifies the MCP transport.',
            'google-tags'=>'Reviewed the public layout changes against existing Google analytics, site verification and Meta pixel integration; only a native Support panel/contact form behavior changed.',
            'agents'=>'Checked SupportBotService and existing agent guidance: new consultation booking requests receive truthful retired-service text, a narrow contact UI hint, no fabricated slot and no private tools.',
            'interface'=>'Reviewed the existing support panel, contact form, shop filters, and shared styles: forms retain canonical fields, CSRF and responsive controls; no new framework or independent UI is introduced.',
            'foundation'=>'Reviewed source/documentation cross references for Support, WebMCP and A2UI. Existing backend roles, private JSON chats and browserless API contracts remain unchanged; in-panel enquiry is not a booked appointment.'
          ];
          foreach($notes as $area=>$reason)$review->record($area,$reason);
          $errors=$review->check();
          if($errors){fwrite(STDERR,implode("\n",$errors)."\n");exit(1);}
          echo "All updated source/doc review receipts verified.\n";
          PHP
          git status --short
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh verified source maps and docs review [generated]'
          git push origin HEAD:refs/heads/fix/support-inline-enquiry-webmcp-20261123
