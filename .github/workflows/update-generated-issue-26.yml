name: Regenerate issue 26 artifacts
on:
  push:
    branches: [fix/issue-26-payment-results]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-26-payment-results
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, pdo_mysql
      - run: ./bapXphp update
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/systematic-map.mmd docs/map.mmd docs/project-index.json map.mmd index.yaml
          git diff --cached --quiet && exit 0
          git commit -m "docs: regenerate project artifacts for issue 26"
          git push origin HEAD:fix/issue-26-payment-results
# Temporary branch-only generator; remove after artifacts are committed.
