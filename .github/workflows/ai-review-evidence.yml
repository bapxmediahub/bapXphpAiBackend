name: Coordinate AI review evidence

# Trigger from trusted CI completion, not arbitrary PR-supplied workflow code.
on:
  workflow_run:
    workflows: [Validate application]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open same-repository PR number
        required: true
        type: string
      mode:
        description: Audit receipts only, or request missing reviews after current-head CI
        required: true
        default: audit
        type: choice
        options: [audit, request]

permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: write

concurrency:
  # A manual audit and CI completion must not race a request for the same SHA.
  group: ai-review-coordination
  cancel-in-progress: false

jobs:
  coordinate:
    name: Audit or request reviews (not approval)
    if: >-
      github.repository == 'bapxmediahub/bapXphpAiBackend' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out trusted default-branch coordinator, never the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect exact-head receipts and request eligible missing reviews
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional dedicated USER token. Sourcery ignores bot-authored comments.
          # Do not substitute GITHUB_TOKEN or an unrelated existing repository secret.
          REVIEW_REQUEST_TOKEN: ${{ secrets.REVIEW_REQUEST_TOKEN }}
        run: node .github/scripts/review-automation.cjs
