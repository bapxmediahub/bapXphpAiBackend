name: Validate application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'ci-ai-bot' && endsWith(github.repository, 'bapXphpAiBackend')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      order-test-mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sps_ci_root_fixture
          MYSQL_DATABASE: sps_order_test
          MYSQL_USER: sps_test
          MYSQL_PASSWORD: sps_ci_fixture
        ports:
          - 33068:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PHP lint and generated artifact validation in the CLI
        run: node --test tests/cli-lint.test.cjs
      - name: Validate reviewer metadata safety and deduplication
        run: node --test tests/review-automation.test.cjs
      - name: Validate PHP, portable fixtures, maps and routes
        run: ./bapXphp ci
      - name: Verify current checkout SHA and safe failure on untrusted references
        run: node --test tests/deployment-revision.test.cjs tests/live-browser-revision.test.cjs
      - name: Verify browser knowledge tool registration, paging and private-path rejection
        run: node --test tests/public-knowledge-webmcp.test.cjs tests/public-products-webmcp.test.cjs tests/public-business-webmcp.test.cjs tests/public-knowledge-api.test.cjs
      - name: Validate bounded WebMCP CDP discovery and invocation correlation
        run: node --test tests/webmcp-cdp.test.cjs
      - name: Verify commerce cancellation, native UI synchronization and captured payment callbacks
        run: node --test tests/public-commerce-webmcp.test.cjs tests/support-checkout.test.cjs tests/checkout-payment.test.cjs
      - name: Check live WebMCP A2UI acceptance probe syntax
        run: |
          node --check tests/live-webmcp-a2ui-browser.cjs
          node --check tests/live-agent-http-discovery.cjs
          node --check tests/live-agent-cart.cjs
      - name: Test real W3C WebMCP 0.1.1 polyfill with Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/w3c-webmcp" --no-audit --no-fund --ignore-scripts @w3c/webmcp-polyfill@0.1.1 playwright@1.62.1
          CHROMIUM_PATH="$(command -v google-chrome)" node tests/webmcp-official-browser.cjs "$RUNNER_TEMP/w3c-webmcp"
          CHROMIUM_PATH="$(command -v google-chrome)" node tests/public-commerce-webmcp-browser.cjs "$RUNNER_TEMP/w3c-webmcp"
      - name: Test native WebMCP through CDP and an isolated agent world
        run: |
          CHROMIUM_PATH="$(command -v google-chrome)" xvfb-run -a node tests/webmcp-official-browser.cjs "$RUNNER_TEMP/w3c-webmcp" --native
          CHROMIUM_PATH="$(command -v google-chrome)" xvfb-run -a node tests/public-commerce-webmcp-browser.cjs "$RUNNER_TEMP/w3c-webmcp" --native
      - name: Exercise the owner composer, installed admin app and public header editing in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/agent-browser" --no-audit --no-fund --ignore-scripts playwright@1.62.1 @modelcontextprotocol/client@2.4.0 @modelcontextprotocol/ext-apps@2.0.4
          NODE_PATH="$RUNNER_TEMP/agent-browser/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" node --test tests/agent-history-browser.cjs tests/admin-pwa-browser.cjs tests/header-menu-browser.cjs tests/mobile-cart-restore-browser.cjs tests/a2ui-public-browser.cjs tests/enterprise-capabilities-browser.cjs tests/openrouter-integrations-browser.cjs tests/home-full-card-browser.cjs tests/homepage-release-browser.cjs tests/google-pagespeed-browser.cjs tests/media-metadata-browser.cjs tests/page-draft-browser.cjs tests/blog-inference-browser.cjs tests/editor-server-recovery-browser.cjs tests/shipping-preview-browser.cjs tests/contact-admission-browser.cjs
      - name: Exercise reusable About layout and live-link contracts
        run: NODE_PATH="$RUNNER_TEMP/agent-browser/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" node --test tests/about-release-browser.cjs tests/site-profile-browser.cjs
      - name: Exercise campaign page editing, preview, and enquiry feedback in Chromium
        run: NODE_PATH="$RUNNER_TEMP/agent-browser/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" node --test tests/campaign-form-browser.cjs tests/campaign-booking-browser.cjs
      - name: Exercise owner Users directory and customer Profile in Chromium
        run: NODE_PATH="$RUNNER_TEMP/agent-browser/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" node --test tests/users-directory-browser.cjs tests/account-profile-browser.cjs
      - name: Exercise owner scheduled mail confirmation in Chromium
        run: NODE_PATH="$RUNNER_TEMP/agent-browser/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" node --test tests/mail-scheduled-browser.cjs
      - name: Exercise owner GST unit configuration and issued reconciliation in Chromium
        run: NODE_PATH="$RUNNER_TEMP/agent-browser/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" node --test tests/gst-unit-browser.cjs
      - name: Exercise native Support checkout and explicit cart handoff at desktop and mobile widths
        run: NODE_PATH="$RUNNER_TEMP/agent-browser/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" node --test tests/support-checkout-browser.cjs tests/remote-cart-review-browser.cjs
      - name: Verify the public tools with the official MCP client
        run: node tests/catalogue-mcp-interop.cjs "$RUNNER_TEMP/agent-browser"
      - name: Verify default and modern official clients against the public MCP dispatcher
        run: |
          node tests/public-mcp-sdk.cjs "$RUNNER_TEMP/agent-browser"
          node tests/public-mcp-shopping-sdk.cjs "$RUNNER_TEMP/agent-browser"
      - name: Verify public MCP over native HTTP without browser or owner sessions
        run: |
          node tests/public-mcp-http.cjs "$RUNNER_TEMP/agent-browser"
          node tests/public-mcp-shopping-http.cjs "$RUNNER_TEMP/agent-browser"
          node tests/public-mcp-checkout-http.cjs "$RUNNER_TEMP/agent-browser"
      - name: Render public cards with the official MCP Apps host bridge in Chrome
        run: |
          CHROMIUM_PATH="$(command -v google-chrome)" node tests/public-mcp-app-browser.cjs "$RUNNER_TEMP/agent-browser"
          CHROMIUM_PATH="$(command -v google-chrome)" node tests/public-mcp-shopping-browser.cjs "$RUNNER_TEMP/agent-browser"
      - name: Validate public catalogue MCP scope and framing
        run: node --test tests/catalogue-mcp.test.cjs
      - name: Validate progressive motion policy and native-scroll bounds
        run: node --test tests/site-motion.test.cjs
      - name: Exercise provider transport, bounded failover and tool call continuation on loopback
        run: |
          php tests/ai-provider-transport.php
          php tests/model-driven-agents.php
      - name: Gate deterministic agent fixture regressions without model APIs
        run: php cli/agent-eval.php
      - name: Verify PHP, MySQL and paged admin records against the isolated CI database
        env:
          BAPX_TEST_MODE: '0'
          BAPX_MYSQL_HOST: '127.0.0.1'
          BAPX_MYSQL_PORT: '33068'
          BAPX_MYSQL_DB: 'sps_order_test'
          BAPX_MYSQL_USER: 'sps_test'
          BAPX_MYSQL_PASS: 'sps_ci_fixture'
          BAPX_REMOTE_DB_URL: 'http://127.0.0.1:1/remotedb'
        run: |
          php cli/runtime-check.php --json --strict
          php tests/admin-list-pagination.php
          php tests/storefront-activity-mysql.php
          node --test tests/catalogue-mcp-mysql.test.cjs tests/mcp-client-access.test.cjs
      - name: Test reporting grant storage and disconnect against isolated MySQL
        run: php tests/google-reporting-storage.php
      - name: Test concurrent verified payments against isolated MySQL
        run: php tests/order-concurrency.php
      - name: Test anonymous cart revisions and durable checkout reconciliation against isolated MySQL
        run: |
          php tests/remote-cart-mysql.php
          php tests/remote-checkout-mysql.php
      - name: Verify campaign booking against isolated MySQL
        run: php tests/campaign-booking.php --mysql
      - name: Verify owner-scoped editor recovery CAS against the isolated database
        run: php tests/editor-draft.php --mysql
      - name: Test concurrent private JSON conversation appends
        run: php tests/agent-concurrency.php
      - name: Test concurrent structured answer review in private JSON
        run: php tests/agent-review-concurrency.php
      - name: Test interrupted agent checkpoint recovery
        run: php tests/agent-interruption.php
      - name: Test duplicate support actions and competing staff against isolated MySQL
        run: php tests/support-ticket-concurrency.php
      - name: Verify SMTP acceptance and uncertain-delivery classification on loopback
        run: php tests/smtp-protocol.php
      - name: Verify concurrent mail claims against isolated MySQL
        run: php tests/mail-delivery-concurrency.php

  webmcp-native-forward:
    if: github.actor != 'ci-ai-bot' && endsWith(github.repository, 'bapXphpAiBackend')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Chrome 160 Tool identity and output schemas
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome)"
          version="$("$chrome" --version | awk '{print $NF}')"
          if ! node -e 'const v=process.argv[1].split(".").map(Number); process.exit(v.length===4 && v.every(Number.isInteger) && (v[0]>160 || (v[0]===160 && v[2]>=8173)) ? 0 : 1)' "$version"; then
            version=160.0.8184.0
            curl --fail --silent --show-error --location --retry 2 --max-time 120 "https://storage.googleapis.com/chrome-for-testing-public/$version/linux64/chrome-linux64.zip" -o "$RUNNER_TEMP/webmcp-chrome.zip"
            unzip -q "$RUNNER_TEMP/webmcp-chrome.zip" -d "$RUNNER_TEMP/webmcp-forward"
            chrome="$RUNNER_TEMP/webmcp-forward/chrome-linux64/chrome"
            test "$("$chrome" --version | awk '{print $NF}')" = "$version"
          fi
          "$chrome" --version
          npm install --prefix "$RUNNER_TEMP/w3c-webmcp-forward" --no-audit --no-fund --ignore-scripts @w3c/webmcp-polyfill@0.1.1 playwright@1.62.1
          CHROMIUM_PATH="$chrome" WEBMCP_REQUIRE_TOOL_INTERFACE=1 xvfb-run -a node tests/webmcp-official-browser.cjs "$RUNNER_TEMP/w3c-webmcp-forward" --native
          CHROMIUM_PATH="$chrome" xvfb-run -a node tests/public-commerce-webmcp-browser.cjs "$RUNNER_TEMP/w3c-webmcp-forward" --native

  php-compatibility:
    if: github.actor != 'ci-ai-bot' && endsWith(github.repository, 'bapXphpAiBackend')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, pdo_mysql, openssl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate native PHP compatibility without production services
        run: ./bapXphp ci
      - name: Verify deterministic agent fixtures
        run: php cli/agent-eval.php
      - name: Verify bounded owner commerce reports
        run: php tests/enterprise-commerce.php
      - name: Verify isolated Markdown compare-and-swap concurrency
        run: BAPX_TEST_MODE=1 php tests/blog-concurrency.php

  hosted-query-compatibility:
    if: github.actor != 'ci-ai-bot' && endsWith(github.repository, 'bapXphpAiBackend')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: sps_ci_root_fixture
          MARIADB_DATABASE: sps_order_test
          MARIADB_USER: sps_test
          MARIADB_PASSWORD: sps_ci_fixture
        ports:
          - 33068:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, pdo_mysql
      - name: Exercise scoped reads on the hosted database family
        env:
          BAPX_TEST_MODE: '0'
          BAPX_MYSQL_HOST: '127.0.0.1'
          BAPX_MYSQL_PORT: '33068'
          BAPX_MYSQL_DB: sps_order_test
          BAPX_MYSQL_USER: sps_test
          BAPX_MYSQL_PASS: sps_ci_fixture
          BAPX_REMOTE_DB_URL: 'http://127.0.0.1:1/remotedb'
        run: |
          php tests/admin-list-pagination.php
          php tests/storefront-activity-mysql.php
      - name: Verify campaign booking on the hosted database family
        run: php tests/campaign-booking.php --mysql
      - name: Verify owner-scoped editor recovery CAS against the isolated database
        run: php tests/editor-draft.php --mysql
