name: Validate application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'ci-ai-bot' && endsWith(github.repository, 'bapXphpAiBackend')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      order-test-mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sps_ci_root_fixture
          MYSQL_DATABASE: sps_order_test
          MYSQL_USER: sps_test
          MYSQL_PASSWORD: sps_ci_fixture
        ports:
          - 33068:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reviewer metadata safety and deduplication
        run: node --test tests/review-automation.test.cjs
      - name: Verify guarded deletion and stale upload history
        run: php tests/media-delete-integration.php
      - name: Verify current checkout SHA and safe failure on untrusted references
        run: |
          php tests/deployment-revision.php
          node --test tests/deployment-revision.test.cjs
      - name: Validate mixed storefront search results and module visibility
        run: php tests/storefront-search.php
      - name: Gate published public knowledge and hidden Markdown isolation
        run: php tests/public-knowledge.php
      - name: Verify browser knowledge tool registration, paging and private-path rejection
        run: node --test tests/public-knowledge-webmcp.test.cjs tests/public-products-webmcp.test.cjs
      - name: Test real W3C WebMCP 0.1.1 polyfill with Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/w3c-webmcp" --no-audit --no-fund --ignore-scripts @w3c/webmcp-polyfill@0.1.1 playwright@1.62.1
          CHROMIUM_PATH="$(command -v google-chrome)" node tests/webmcp-official-browser.cjs "$RUNNER_TEMP/w3c-webmcp"
      - name: Exercise the owner composer, installed admin app and public header editing in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/agent-browser" --no-audit --no-fund --ignore-scripts playwright@1.62.1 @modelcontextprotocol/client@2.4.0
          NODE_PATH="$RUNNER_TEMP/agent-browser/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" node --test tests/agent-history-browser.cjs tests/admin-pwa-browser.cjs tests/header-menu-browser.cjs tests/mobile-cart-restore-browser.cjs
      - name: Verify the public tools with the official MCP client
        run: node tests/catalogue-mcp-interop.cjs "$RUNNER_TEMP/agent-browser"
      - name: Validate public catalogue MCP scope and framing
        run: node --test tests/catalogue-mcp.test.cjs
      - name: Validate progressive motion policy and native-scroll bounds
        run: node --test tests/site-motion.test.cjs
      - name: Test documentation drift and issue-tracker boundaries
        run: php tests/documentation-review.php
      - name: Validate code, tests, maps, and routes
        run: ./bapXphp ci
      # REVISION-DOCSYNC-BEGIN
      - name: Export generated revision maps and documentation receipts (temporary)
        if: always()
        run: |
          python3 -c 'from pathlib import Path; p=Path(".github/workflows/ci.yml"); s=p.read_text(); a=s.index("      # REVISION-DOCSYNC-BEGIN\n"); b=s.index("      # REVISION-DOCSYNC-END\n",a)+len("      # REVISION-DOCSYNC-END\n"); p.write_text(s[:a]+s[b:])'
          ./bapXphp update || true
          php -r 'require "app/bootstrap.php"; require "cli/lib/DocumentationReview.php"; $r=new DocumentationReview(getcwd(),require "config/documentation.php"); $notes=[
          "operator-help"=>"Compared unchanged authenticated help routes and views with the new public SHA lookup, which never reads operator guides or chat histories.",
          "http-errors"=>"Reviewed exact safe deployment revision HTTP 200 match/mismatch, 400 malformed SHA, 503 missing Git metadata, no-store responses and absence of path or credential leakage.",
          "workflow"=>"Reviewed the main CI fixtures and separate verified-deployment workflow: exact SHA comparison, bounded polling, isolated live guest cart add/remove and no production payment or credential operation.",
          "foundation"=>"Reviewed the Git-head reader for detached, loose, packed and invalid refs; no shell on public requests, no MySQL fallback and no user-selected file paths; checked Hostinger release instructions.",
          "interface"=>"Reviewed mobile post-release acceptance flow against restored brand, top cart and floating pill without altering the existing mobile design.",
          "auth"=>"Reviewed public hash-only API and confirmed no admin access or customer/session reads and no token-bearing parameters are accepted.",
          "commerce"=>"Reviewed isolated guest add/decrement cart acceptance without checkout, orders, payments, database migrations or customer credentials.",
          "mail"=>"Reviewed standalone release verification and confirmed no SMTP, inbox, queue or outbound email side effects.",
          "mcp-clients"=>"Confirmed new revision status endpoint is independent of existing scoped MCP client grants and their authorization checks.",
          "google-tags"=>"Reviewed release verification impact and confirmed no Google analytics tags, provider tokens or consent behavior changed.",
          "media"=>"Reviewed post-deploy probe and confirmed no upload or deletion of customer media and no contact with protected media storage.",
          "sales-channels"=>"Reviewed public product-only cart acceptance and confirmed no Google Merchant or cross-channel publishing changes.",
          "agents"=>"Checked deployment revision verification does not read per-actor JSON agent histories, private instructions or model tool capabilities.",
          "content"=>"Reviewed documentation changes and confirmed no new public Markdown directory listing or private authored-page access."
          ]; foreach($r->check() as $e){if(preg_match("/^([a-z][a-z0-9-]+): source\/doc review missing or stale/",$e,$m)){if(!isset($notes[$m[1]]))exit(3);$r->record($m[1],$notes[$m[1]]);}}'
          for f in docs/agent-tool-contracts.md docs/systematic-map.mmd docs/map.mmd docs/project-index.json index.yaml map.mmd docs/source-contracts.json; do
            echo "REVISION_DOCSYNC_START $f"
            base64 -w 3000 "$f" | sed 's/^/REVISION_DOCSYNC_B64 /'
            echo "REVISION_DOCSYNC_END $f"
          done
      # REVISION-DOCSYNC-END




      - name: Exercise provider transport, bounded failover and tool call continuation on loopback
        run: php tests/ai-provider-transport.php
      - name: Gate deterministic agent fixture regressions without model APIs
        run: php cli/agent-eval.php
      - name: Verify PHP, MySQL and paged admin records against the isolated CI database
        env:
          BAPX_TEST_MODE: '0'
          BAPX_MYSQL_HOST: '127.0.0.1'
          BAPX_MYSQL_PORT: '33068'
          BAPX_MYSQL_DB: 'sps_order_test'
          BAPX_MYSQL_USER: 'sps_test'
          BAPX_MYSQL_PASS: 'sps_ci_fixture'
          BAPX_REMOTE_DB_URL: 'http://127.0.0.1:1/remotedb'
        run: |
          php cli/runtime-check.php --json --strict
          php tests/admin-list-pagination.php
          node --test tests/catalogue-mcp-mysql.test.cjs tests/mcp-client-access.test.cjs
      - name: Test reporting grant storage and disconnect against isolated MySQL
        run: php tests/google-reporting-storage.php
      - name: Test concurrent verified payments against isolated MySQL
        run: php tests/order-concurrency.php
      - name: Test concurrent private JSON conversation appends
        run: php tests/agent-concurrency.php
      - name: Test concurrent structured answer review in private JSON
        run: php tests/agent-review-concurrency.php
      - name: Test interrupted agent checkpoint recovery
        run: php tests/agent-interruption.php
      - name: Test duplicate support actions and competing staff against isolated MySQL
        run: php tests/support-ticket-concurrency.php
      - name: Verify SMTP acceptance and uncertain-delivery classification on loopback
        run: php tests/smtp-protocol.php
      - name: Verify concurrent mail claims against isolated MySQL
        run: php tests/mail-delivery-concurrency.php

  php-compatibility:
    if: github.actor != 'ci-ai-bot' && endsWith(github.repository, 'bapXphpAiBackend')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, pdo_mysql, openssl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate native PHP compatibility without production services
        run: ./bapXphp ci
      - name: Verify deterministic agent fixtures
        run: php cli/agent-eval.php
      - name: Verify isolated Markdown compare-and-swap concurrency
        run: BAPX_TEST_MODE=1 php tests/blog-concurrency.php

  hosted-query-compatibility:
    if: github.actor != 'ci-ai-bot' && endsWith(github.repository, 'bapXphpAiBackend')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: sps_ci_root_fixture
          MARIADB_DATABASE: sps_order_test
          MARIADB_USER: sps_test
          MARIADB_PASSWORD: sps_ci_fixture
        ports:
          - 33068:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
      - name: Exercise admin search and media deduplication on the hosted database family
        env:
          BAPX_TEST_MODE: '0'
          BAPX_MYSQL_HOST: '127.0.0.1'
          BAPX_MYSQL_PORT: '33068'
          BAPX_MYSQL_DB: sps_order_test
          BAPX_MYSQL_USER: sps_test
          BAPX_MYSQL_PASS: sps_ci_fixture
          BAPX_REMOTE_DB_URL: 'http://127.0.0.1:1/remotedb'
        run: php tests/admin-list-pagination.php
