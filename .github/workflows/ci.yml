name: Validate application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'ci-ai-bot' && endsWith(github.repository, 'bapXphpAiBackend')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, pdo_mysql
      - name: Regenerate branch artifacts
        run: ./bapXphp update
      - uses: actions/upload-artifact@v4
        with:
          name: issue-26-generated
          path: |
            docs/systematic-map.mmd
            docs/map.mmd
            docs/project-index.json
            map.mmd
            index.yaml
      - name: Validate code, tests, maps, and routes
        run: ./bapXphp ci
