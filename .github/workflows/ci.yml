name: Validate application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'ci-ai-bot' && endsWith(github.repository, 'bapXphpAiBackend')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      order-test-mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sps_ci_root_fixture
          MYSQL_DATABASE: sps_order_test
          MYSQL_USER: sps_test
          MYSQL_PASSWORD: sps_ci_fixture
        ports:
          - 33068:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reviewer metadata safety and deduplication
        run: node --test tests/review-automation.test.cjs
      - name: Verify guarded deletion and stale upload history
        run: php tests/media-delete-integration.php
      - name: Validate mixed storefront search results and module visibility
        run: php tests/storefront-search.php
      - name: Gate published public knowledge and hidden Markdown isolation
        run: php tests/public-knowledge.php
      - name: Verify browser knowledge tool registration, paging and private-path rejection
        run: node --test tests/public-knowledge-webmcp.test.cjs
      - name: Exercise the owner composer, installed admin app and public header editing in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/agent-browser" --no-audit --no-fund --ignore-scripts playwright@1.62.1 @modelcontextprotocol/client@2.4.0
          NODE_PATH="$RUNNER_TEMP/agent-browser/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" node --test tests/agent-history-browser.cjs tests/admin-pwa-browser.cjs tests/header-menu-browser.cjs
      - name: Verify the public tools with the official MCP client
        run: node tests/catalogue-mcp-interop.cjs "$RUNNER_TEMP/agent-browser"
      - name: Validate public catalogue MCP scope and framing
        run: node --test tests/catalogue-mcp.test.cjs
      - name: Validate progressive motion policy and native-scroll bounds
        run: node --test tests/site-motion.test.cjs
      - name: Test documentation drift and issue-tracker boundaries
        run: php tests/documentation-review.php
      - name: Validate code, tests, maps, and routes
        run: ./bapXphp ci
      # DOCSYNC-REMOVE-BEGIN
      - name: Generate reviewed documentation for this feature branch (temporary)
        if: always()
        run: |
          python3 -c 'from pathlib import Path; p=Path(".github/workflows/ci.yml"); s=p.read_text(); a=s.index("      # DOCSYNC-REMOVE-BEGIN\n"); b=s.index("      # DOCSYNC-REMOVE-END\n",a)+len("      # DOCSYNC-REMOVE-END\n"); p.write_text(s[:a]+s[b:])'
          ./bapXphp update || true
          php -r 'require "app/bootstrap.php"; require "cli/lib/DocumentationReview.php"; $r=new DocumentationReview(getcwd(),require "config/documentation.php"); $notes=["agents"=>"Cross-reviewed new shared article retrieval used by the Enterprise and Support context, with published-only filtering and no private chat tool access.","content"=>"Reviewed published Markdown source, future/draft/symlink filtering and bounded article metadata against blog and customer help documentation.","mcp-clients"=>"Reviewed new native read-only article discovery, argument schemas, module disabling and refusal to reveal owner scopes.","operator-help"=>"Confirmed owner help remains role-gated while public customer guides are published BlogService entries, not raw admin Markdown.","google-tags"=>"Checked public layout addition is a read-only schema and deferred script with no Google consent or reporting credential changes.","workflow"=>"Reviewed the new synthetic public Markdown, WebMCP and MCP transport test gates and generated documentation process.","interface"=>"Reviewed browser WebMCP tool registration, client-side response checks and public layout schema, without exposing authenticated state.","foundation"=>"Reviewed public PHP capability service, API endpoint routing, module guard and preservation of MySQL and private JSON session boundaries.","http-errors"=>"Reviewed public knowledge API errors for bounded client input, safe 400/503 responses and no internal exception disclosure.","media"=>"Reviewed deployment documentation and confirmed media storage and protected file paths remain independent of public article metadata.","sales-channels"=>"Reviewed shared public catalogue projection using ProductService visibility and offer windows without altering checkout or merchant feeds.","commerce"=>"Reviewed catalogue read-only projection and verified it does not mutate payment, order, tax or commerce state.","auth"=>"Reviewed public GET metadata endpoint and verified no customer identities or authorization tokens are surfaced.","mail"=>"Reviewed the public knowledge browser script and confirmed no mail generation, queue replay or provider credential access."]; foreach($r->check() as $e){if(preg_match("/^([a-z][a-z0-9-]+): source\/doc review missing or stale/",$e,$m)){if(!isset($notes[$m[1]]))exit(3);$r->record($m[1],$notes[$m[1]]);}}'
          for f in docs/agent-tool-contracts.md docs/systematic-map.mmd docs/map.mmd docs/project-index.json index.yaml map.mmd docs/source-contracts.json; do
            echo "DOCSYNC_START $f"
            base64 -w 3000 "$f" | sed 's/^/DOCSYNC_B64 /'
            echo "DOCSYNC_END $f"
          done
      # DOCSYNC-REMOVE-END

      - name: Exercise provider transport, bounded failover and tool call continuation on loopback
        run: php tests/ai-provider-transport.php
      - name: Gate deterministic agent fixture regressions without model APIs
        run: php cli/agent-eval.php
      - name: Verify PHP, MySQL and paged admin records against the isolated CI database
        env:
          BAPX_TEST_MODE: '0'
          BAPX_MYSQL_HOST: '127.0.0.1'
          BAPX_MYSQL_PORT: '33068'
          BAPX_MYSQL_DB: 'sps_order_test'
          BAPX_MYSQL_USER: 'sps_test'
          BAPX_MYSQL_PASS: 'sps_ci_fixture'
          BAPX_REMOTE_DB_URL: 'http://127.0.0.1:1/remotedb'
        run: |
          php cli/runtime-check.php --json --strict
          php tests/admin-list-pagination.php
          node --test tests/catalogue-mcp-mysql.test.cjs tests/mcp-client-access.test.cjs
      - name: Test reporting grant storage and disconnect against isolated MySQL
        run: php tests/google-reporting-storage.php
      - name: Test concurrent verified payments against isolated MySQL
        run: php tests/order-concurrency.php
      - name: Test concurrent private JSON conversation appends
        run: php tests/agent-concurrency.php
      - name: Test concurrent structured answer review in private JSON
        run: php tests/agent-review-concurrency.php
      - name: Test interrupted agent checkpoint recovery
        run: php tests/agent-interruption.php
      - name: Test duplicate support actions and competing staff against isolated MySQL
        run: php tests/support-ticket-concurrency.php
      - name: Verify SMTP acceptance and uncertain-delivery classification on loopback
        run: php tests/smtp-protocol.php
      - name: Verify concurrent mail claims against isolated MySQL
        run: php tests/mail-delivery-concurrency.php

  php-compatibility:
    if: github.actor != 'ci-ai-bot' && endsWith(github.repository, 'bapXphpAiBackend')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, pdo_mysql, openssl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate native PHP compatibility without production services
        run: ./bapXphp ci
      - name: Verify deterministic agent fixtures
        run: php cli/agent-eval.php
      - name: Verify isolated Markdown compare-and-swap concurrency
        run: BAPX_TEST_MODE=1 php tests/blog-concurrency.php

  hosted-query-compatibility:
    if: github.actor != 'ci-ai-bot' && endsWith(github.repository, 'bapXphpAiBackend')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: sps_ci_root_fixture
          MARIADB_DATABASE: sps_order_test
          MARIADB_USER: sps_test
          MARIADB_PASSWORD: sps_ci_fixture
        ports:
          - 33068:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
      - name: Exercise admin search and media deduplication on the hosted database family
        env:
          BAPX_TEST_MODE: '0'
          BAPX_MYSQL_HOST: '127.0.0.1'
          BAPX_MYSQL_PORT: '33068'
          BAPX_MYSQL_DB: sps_order_test
          BAPX_MYSQL_USER: sps_test
          BAPX_MYSQL_PASS: sps_ci_fixture
          BAPX_REMOTE_DB_URL: 'http://127.0.0.1:1/remotedb'
        run: php tests/admin-list-pagination.php
