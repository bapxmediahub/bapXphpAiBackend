name: Refresh Integrations mobile source review (temporary)
on:
  push:
    branches: [fix/integrations-375px-overflow-20261124]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, json, pdo_mysql
      - name: Refresh exact-source UI review and remove transient workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-integrations-mobile-review.yml
          php cli/docs-check.php --record interface --reason "Reviewed owner Integrations mobile 375px Chromium overflow after #351 merge: a long code URL imposed min-content width, causing 445px scroll. Scoped CSS now constrains the existing admin form, fieldsets and inline API paths without truncating text, changing model secrets, or altering role permissions. Native integration and browser tests guard the fix."
          php cli/docs-check.php --check
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: record reviewed owner Integrations mobile fix [generated]'
          git push origin HEAD:refs/heads/fix/integrations-375px-overflow-20261124
