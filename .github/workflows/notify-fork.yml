name: Notify downstream fork

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'getwinharris/bapXphpAiBackend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to downstream fork
        env:
          FORK_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          git remote add fork https://bapxmediahub:${FORK_TOKEN}@github.com/bapxmediahub/bapXphpAiBackend.git
          git push fork main:main
          echo "Synced ${GITHUB_SHA} → bapxmediahub/bapXphpAiBackend main"
