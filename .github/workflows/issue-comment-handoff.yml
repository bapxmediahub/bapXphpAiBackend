name: Issue comment handoff

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write

jobs:
  route:
    if: startsWith(github.event.comment.body, '/handoff ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse handoff target
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          TARGET=$(echo "$COMMENT" | sed 's/\/handoff //')
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "Handoff requested: issue #${{ github.event.issue.number }} → $TARGET"
      - name: Route handoff
        run: |
          ISSUE="${{ github.event.issue.number }}"
          TARGET="${{ steps.parse.outputs.target }}"
          EVENT_FILE=".agents/handoffs/events/${ISSUE}.json"
          ACTIVE_FILE=".agents/handoffs/active/current.json"
          mkdir -p .agents/handoffs/events .agents/handoffs/active

          if [ -f "$EVENT_FILE" ]; then
            # Update the handoff event with the new role
            cat "$EVENT_FILE" | jq --arg role "$TARGET" \
              '.workflow.current_role = $role | .workflow.next_role = (if $role == "cto" then "worker" elif $role == "worker" then "reviewer" else "cto" end)' \
              > "$ACTIVE_FILE"
          else
            # Create a new event if none exists
            cat > "$ACTIVE_FILE" << EOF
            {
              "event_type": "issue_comment.created",
              "issue": $ISSUE,
              "actor": "${{ github.actor }}",
              "workflow": {
                "current_role": "$TARGET",
                "next_role": "$(if [ "$TARGET" = "maya" ]; then echo worker; elif [ "$TARGET" = "worker" ]; then echo reviewer; else echo maya; fi)",
                "sequence": ["maya", "worker", "reviewer", "maya"]
              },
              "payload": {
                "comment": $(echo '${{ github.event.comment.body }}' | jq -Rs .)
              },
              "repository": {
                "owner": "${{ github.repository_owner }}",
                "name": "${{ github.event.repository.name }}"
              },
              "objectives": [{"id": "OBJ-${ISSUE}-1", "status": "in_progress", "evidence": [], "browser_evidence": [], "unresolved": []}],
              "telemetry": {
                "started_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                "handoffs_completed": 1
              }
            }
            EOF
          fi

          jq empty "$ACTIVE_FILE" && echo "Valid handoff routed to: $TARGET"
      - name: Commit handoff
        run: |
          git config user.name "handoff-router-bot"
          git config user.email "bot@bapXphp.local"
          git add .agents/handoffs/
          git diff --cached --quiet || git commit -m "auto: handoff route to ${{ steps.parse.outputs.target }} for issue #${{ github.event.issue.number }}"
          git push
      - name: Confirm handoff
        run: |
          gh issue comment ${{ github.event.issue.number }} --body \
            "## ➡️ Handoff routed to **${{ steps.parse.outputs.target }}**

            | Role | Status |
            |------|--------|
            | Previous | ✅ completed |
            | Current | 🔄 ${{ steps.parse.outputs.target }} |
            | Next | ⏳ awaiting completion |

            Active handoff: \`.agents/handoffs/active/current.json\`"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
