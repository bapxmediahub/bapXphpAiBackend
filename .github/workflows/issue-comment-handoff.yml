name: Issue comment handoff

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write

concurrency:
  group: handoff-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  route:
    if: github.repository == 'bapxmediahub/bapXphpAiBackend' && github.actor != 'handoff-ai-bot' && github.actor != 'bapxai[bot]' && (startsWith(github.event.comment.body, '/handoff ') || startsWith(github.event.comment.body, '/review') || contains(github.event.comment.body, '@bapXai'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create bapXai installation token
        id: app-token
        if: vars.BAPXAI_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BAPXAI_APP_ID }}
          private-key: ${{ secrets.BAPXAI_PRIVATE_KEY }}
      - name: Parse handoff target
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          if echo "$COMMENT" | grep -q '^/handoff '; then
            TARGET=$(echo "$COMMENT" | sed 's/\/handoff //')
          elif echo "$COMMENT" | grep -qi '@bapXai'; then
            TARGET="cto"
          else
            TARGET="reviewer"
          fi
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "Handoff requested: issue #${{ github.event.issue.number }} → $TARGET"
      - name: Route handoff
        run: |
          ISSUE="${{ github.event.issue.number }}"
          TARGET="${{ steps.parse.outputs.target }}"
          EVENT_FILE=".agents/handoffs/events/${ISSUE}.json"
          ACTIVE_FILE=".agents/handoffs/active/current.json"
          mkdir -p .agents/handoffs/events .agents/handoffs/active

          if [ -f "$EVENT_FILE" ]; then
            cat "$EVENT_FILE" | jq --arg role "$TARGET" \
              '.workflow.current_role = $role | .workflow.next_role = (if $role == "cto" then "worker" elif $role == "worker" then "reviewer" else "cto" end)' \
              > "$ACTIVE_FILE"
          else
            cat > "$ACTIVE_FILE" << EOF
            {
              "event_type": "issue_comment.created",
              "issue": $ISSUE,
              "actor": "${{ github.actor }}",
              "workflow": {
                "current_role": "$TARGET",
                "next_role": "$(if [ "$TARGET" = "cto" ]; then echo worker; elif [ "$TARGET" = "worker" ]; then echo reviewer; else echo cto; fi)",
                "sequence": ["cto", "worker", "reviewer", "cto"]
              },
              "payload": {
                "title": $(echo '${{ github.event.issue.title }}' | jq -Rs .),
                "body": $(echo '${{ github.event.issue.body }}' | jq -Rs .),
                "comment": $(echo '${{ github.event.comment.body }}' | jq -Rs .),
                "issue_url": "${{ github.event.issue.html_url }}"
              },
              "repository": {
                "owner": "${{ github.repository_owner }}",
                "name": "${{ github.event.repository.name }}"
              },
              "objectives": [{"id": "OBJ-${ISSUE}-1", "status": "in_progress", "evidence": [], "browser_evidence": [], "unresolved": []}],
              "telemetry": {
                "started_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                "handoffs_completed": 1
              }
            }
            EOF
          fi

          jq empty "$ACTIVE_FILE" && echo "Valid handoff routed to: $TARGET"
      - name: Commit handoff
        run: |
          git config user.name "handoff-ai-bot"
          git config user.email "handoff-ai-bot@bapXphp.action"
          git add .agents/handoffs/
          git diff --cached --quiet || git commit -m "auto: handoff route to ${{ steps.parse.outputs.target }} for issue #${{ github.event.issue.number }}"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" 2>/dev/null || true
            if git push origin "HEAD:$GITHUB_REF_NAME" 2>/dev/null; then exit 0; fi
            sleep 2
          done
          git pull --rebase origin "$GITHUB_REF_NAME" 2>/dev/null || true
          git push --force-with-lease origin "HEAD:$GITHUB_REF_NAME"
      - name: Confirm handoff
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const isMention = /@bapxai/i.test(context.payload.comment.body || '');
            const prefix = isMention
              ? '## bapXai CTO request accepted'
              : `## Handoff routed to **${process.env.TARGET}**`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `${prefix}

            | Role | Status |
            |------|--------|
            | Current | ${process.env.TARGET} |
            | Next | source-grounded diagnosis |
            | Issue | #${context.issue.number} |

            The CTO handoff now contains the issue title, description, triggering comment, and repository URL. The next agent must inspect the mapped route, owning files, and current issue evidence before changing code.

            Active handoff: \`.agents/handoffs/active/current.json\``
            });
        env:
          TARGET: ${{ steps.parse.outputs.target }}
