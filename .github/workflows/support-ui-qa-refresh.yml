name: Regenerate Support UI QA receipts (temporary)
on:
  push:
    branches: [fix/support-inline-enquiry-webmcp-20261123]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, pdo_mysql
      - name: Regenerate maps, review source changes, remove temporary workflow
        run: |
          git rm .github/workflows/support-ui-qa-refresh.yml
          ./bapXphp update
          php <<'PHP'
          <?php
          require 'app/bootstrap.php';
          require 'cli/lib/DocumentationReview.php';
          $review=new DocumentationReview(getcwd(),require 'config/documentation.php');
          $notes=[
            'operator-help'=>'Reviewed unchanged admin help and existing Support form action: hiding the floating launcher when the panel opens does not expand operator permissions or change guide semantics.',
            'mcp-clients'=>'Checked native Support CSS and browser regression against the unchanged MCP client grant and public tool boundaries: no new client access or tool mutations.',
            'remote-commerce'=>'Reviewed native Support checkout UI alongside new launcher visibility rule and Chromium checks. Cart actions, payment boundaries and saved capability access are unchanged.',
            'public-mcp'=>'Reviewed existing public MCP/Apps tool registration; the launcher visibility rule is confined to native Support styling and does not change MCP transport or schemas.',
            'google-tags'=>'Reviewed public layout and analytics dependency: no new Google tag, OAuth setting, event or external credential is touched by the Support CSS change.',
            'agents'=>'Reviewed existing Support/Enterprise separation: the regression changes only launcher visibility; no prompt, model tools, actor identity or chat persistence is expanded.',
            'interface'=>'Inspected live production mobile/desktop screenshots showing the duplicate Support launcher behind the open panel. Visibility hiding is reversible and new Chromium assertion covers it.',
            'foundation'=>'Reviewed generated architecture and WebMCP references with the unchanged commerce semantics: the UI fix remains in the existing Support panel, not a new interface.'
          ];
          foreach($notes as $area=>$reason)$review->record($area,$reason);
          $errors=$review->check();if($errors){fwrite(STDERR,implode("\n",$errors)."\n");exit(1);}
          PHP
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: regenerate source maps and reviewed QA receipts [generated]'
          git push origin HEAD:refs/heads/fix/support-inline-enquiry-webmcp-20261123
