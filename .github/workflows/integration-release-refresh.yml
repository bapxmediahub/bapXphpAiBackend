name: Regenerate integrated release receipts (one-time)
on:
  push:
    branches: [release/integrate-345-347-350-20261124]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, pdo_mysql
      - name: Regenerate exact combined source, review docs, remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/integration-release-refresh.yml
          ./bapXphp update
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'app/bootstrap.php';
          require 'cli/lib/DocumentationReview.php';
          $review=new DocumentationReview(getcwd(),require 'config/documentation.php');
          $notes=[
            'http-errors'=>'Inspected unchanged request-boundary API and error handling against the merged Support contact action and OpenRouter transport: no new externally writable route, disabled TLS validation or error-body credential exposure.',
            'mcp-clients'=>'Compared existing MCP client grants and owner-only tool restrictions against merged WebMCP annotations and OpenRouter model routing; the changes do not issue an owner grant or promote browser agent capabilities.',
            'remote-commerce'=>'Reviewed existing cart, payment, remote checkout and support-commerce fixtures with the merged inline enquiry and native product rail: no new payment method, cart mutation tool or changes to confirmed order callbacks.',
            'public-mcp'=>'Reviewed existing public MCP registry and A2UI renderer with declarative shop GET and contact POST forms; public tools remain bounded and read-only except already authorized cart capabilities, and contact POST never auto-submits.',
            'google-tags'=>'Reviewed public layout changes against existing Google Analytics and advertising tags. Google AI credentials remain independent of OAuth, analytics tags and OpenRouter encrypted provider key.',
            'sales-channels'=>'Reviewed merchant feed and product source alongside the native swipeable A2UI cards. All prices, stock labels and official image paths still originate from the same published product service.',
            'agents'=>'Compared Support deterministic retired-booking path, Enterprise grounded answers, shared OpenRouter/Gemma failover, tool result replay guard and role policy against current source; existing private chat JSON location remains unchanged.',
            'mail'=>'Reviewed the in-panel reuse of original /contact form with existing ContactService persistence and SMTP mail queue; no automatic real contact submission, mass retry or new email notification route was introduced.',
            'content'=>'Reviewed blog and authored-page sources against the A2UI renderer and published article links; no new user-controlled HTML rendering, raw Markdown promotion or publication visibility change.',
            'commerce'=>'Reviewed cart/order/product routes with existing Support inline commerce and new product rail CSS; all existing checkout and product prices remain server-authored, and no extra payment or stock writes were added.',
            'auth'=>'Reviewed admin Integrations and Enterprise agent controls: existing admin requireAdmin and CSRF checks remain, OpenRouter password is masked, blank preserves encrypted record and no browser agent can assume owner identity.',
            'media'=>'Reviewed product image paths and the bounded A2UI gallery against current media hosting paths; styling does not move uploads, delete media or expose private asset directories.',
            'workflow'=>'Reviewed trusted CI jobs, reviewer coordinator and new Chromium fixture runner: isolated synthetic screenshots and test data, no API keys or admin passwords in workflows, and no privileged fork checkout.',
            'interface'=>'Reviewed 375px and 1280px screenshots and synthetic Chromium fixtures. Existing Support panel gains a compact composer, inline contact view and bounded product swipe rail; Enterprise answer cards gain wider responsive layout.',
            'foundation'=>'Cross-checked merged Support/Enterprise/WebMCP/OpenRouter source against architecture maps and docs. No separate chatbot app, SQL schema, external chat plugin or production browser engine is introduced.',
            'operator-help'=>'Reviewed existing admin guide and settings dependencies after adding the opt-in OpenRouter field and Enterprise answer-width CSS; operator scope and help links remain, with no new permission surface.'
          ];
          $snap=$review->snapshots();
          $receipts=json_decode(file_get_contents('docs/source-contracts.json'),true,512,JSON_THROW_ON_ERROR)['reviews']??[];
          $changed=[];
          foreach($snap as $area=>$item){
            $past=$receipts[$area]??[];
            if(($past['source_sha256']??'')===$item['source_sha256']
                && ($past['references_sha256']??'')===$item['references_sha256'])continue;
            if(!isset($notes[$area]))throw new RuntimeException('Missing explicit review rationale for '.$area);
            $review->record($area,$notes[$area]);
            $changed[]=$area;
          }
          $errors=$review->check();
          if($errors){fwrite(STDERR,implode("\n",$errors)."\n");exit(1);}
          echo "Updated source/documentation reviews: ".implode(', ',$changed)."\n";
          PHP
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: regenerate combined architecture and document review [generated]'
          git push origin HEAD:refs/heads/release/integrate-345-347-350-20261124
