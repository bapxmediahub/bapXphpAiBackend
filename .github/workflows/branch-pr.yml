name: Open branch pull request

on:
  push:
    branches:
      - 'codex/**'
      - 'fix/**'
      - 'feat/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: branch-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open:
    if: github.repository == 'bapxmediahub/bapXphpAiBackend'
    runs-on: ubuntu-latest
    steps:
      - name: Create bapXai installation token
        id: app-token
        if: vars.BAPXAI_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BAPXAI_APP_ID }}
          private-key: ${{ secrets.BAPXAI_PRIVATE_KEY }}
      - uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            try {
              const head = context.ref.replace('refs/heads/', '');
              const pulls = await github.rest.pulls.list({
                ...context.repo,
                state: 'open',
                head: `${context.repo.owner}:${head}`,
                base: 'main'
              });
              if (pulls.data.length) {
                core.info(`PR #${pulls.data[0].number} already tracks ${head}`);
                return;
              }
              const title = head
                .replace(/^(codex|fix|feat)\//, '')
                .replace(/[-_]+/g, ' ')
                .replace(/\b\w/g, value => value.toUpperCase());
              const result = await github.rest.pulls.create({
                ...context.repo,
                title,
                head,
                base: 'main',
                body: [
                  'Created automatically from a pushed implementation branch.',
                  '',
                  'GitHub Actions owns CI, handoff comments, and review routing.',
                  'Merge only after validation and Reviewer evidence pass.'
                ].join('\n')
              });
              core.info(`Created PR #${result.data.number}`);
            } catch (error) {
              if (error.status === 403) {
                core.warning('PR creation is disabled for GITHUB_TOKEN. Configure the bapXai GitHub App or enable Actions pull-request creation in repository settings.');
                return;
              }
              throw error;
            }
