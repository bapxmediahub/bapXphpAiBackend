name: Native chat Chromium QA
on:
  push:
    branches:
      - feat/native-chat-layout-qa-20261124
  pull_request:
    paths:
      - assets/css/a2ui-public.css
      - assets/a2ui-public-renderer.js
      - views/admin/agent.php
      - tests/chat-ui-playwright.cjs
      - cli/agent-browser-qa.sh
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-chat-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, json, pdo_mysql
      - name: Install pinned isolated Playwright runner
        run: npm install --prefix "$RUNNER_TEMP/chat-ux" --no-audit --no-fund --ignore-scripts playwright@1.62.1
      - name: Run actual PHP Support and Enterprise layouts in headless Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/chat-ux/node_modules
        run: bash cli/agent-browser-qa.sh
      - name: Save synthetic browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-chat-layout-qa
          path: qa-chat-ui-artifacts/
          retention-days: 3
          if-no-files-found: ignore
