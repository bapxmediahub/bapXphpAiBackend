name: Refresh reviewed OpenRouter source artifacts
on:
  push:
    branches: [feat/openrouter-free-google-fallback-20261123]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, pdo_mysql
      - name: Regenerate and review exact source then remove one-time workflow
        run: |
          git rm .github/workflows/bapx-openrouter-refresh.yml
          ./bapXphp update
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'app/bootstrap.php';
          require 'cli/lib/DocumentationReview.php';
          $review=new DocumentationReview(getcwd(),require 'config/documentation.php');
          $notes=[
            'mcp-clients'=>'Reviewed owner MCP client connection and integration dependencies: model provider selection does not modify grants, owner sessions, MCP tools, client secrets or tool permissions.',
            'operator-help'=>'Reviewed unchanged owner guides and admin integration dependencies: OpenRouter is an optional first provider; owner roles, account settings and help access remain unchanged.',
            'remote-commerce'=>'Reviewed shared provider usage with existing native Support checkout: OpenRouter changes only model transport; it cannot alter cart, order, payment or idempotent checkout actions.',
            'public-mcp'=>'Reviewed public MCP boundaries: no remote tool exposure, no API key in public responses, and no change to published public MCP or browser WebMCP tool declarations.',
            'google-tags'=>'Reviewed unchanged analytics and Google tags against provider integration changes. Google AI credentials remain independent from Google Analytics, OAuth and site verification.',
            'agents'=>'Compared AiClient and SecretService against the two existing Gemma fallback models, bounded provider timeouts, actor-scoped tools and encrypted remote settings. No secret is committed.',
            'interface'=>'Reviewed the native Admin Integrations PHP form and Chromium test: separate password input, retained encrypted key and explicit enable toggle; no new frontend application.',
            'foundation'=>'Reviewed cross-provider routing against architecture and existing PHP/JSON persistence; no new tables, hosted agent framework, unrestricted model tool or alternative database is introduced.',
            'workflow'=>'Reviewed CI additions and existing PHP/Chromium fixtures. The test uses synthetic credentials and does not contact a real OpenRouter account or remote database.'
          ];
          foreach($notes as $area=>$reason)$review->record($area,$reason);
          $errors=$review->check();if($errors){fwrite(STDERR,implode("\n",$errors)."\n");exit(1);}
          PHP
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh reviewed OpenRouter maps and docs [generated]'
          git push origin HEAD:refs/heads/feat/openrouter-free-google-fallback-20261123
