name: Refresh reviewed OpenRouter source artifacts
on:
  push:
    branches: [feat/opt-in-openrouter-free-gemma-fallback-20261123]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, pdo_mysql
      - name: Rebuild source maps and reviewed receipts on this source tree
        run: |
          git rm .github/workflows/bapx-openrouter-refresh.yml
          ./bapXphp update
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'app/bootstrap.php';
          require 'cli/lib/DocumentationReview.php';
          $review=new DocumentationReview(getcwd(),require 'config/documentation.php');
          $notes=[
            'operator-help'=>'Reviewed operator Help and its unchanged private role boundary against the new opt-in AI key control. No support, order, or admin tool permissions were expanded.',
            'mcp-clients'=>'Reviewed the original scoped MCP client management guide and interfaces; a provider selection affects AiClient inference only, not local MCP grants or the public tool registry.',
            'remote-commerce'=>'Reviewed public shopping tool transport and existing Support checkout. This change is an optional model route; no cart, checkout, payment or recovery behavior was altered.',
            'google-tags'=>'Reviewed Google reporting and tag setup alongside the Integrations field changes; no OAuth, tag, analytics or tracking credential/permission change was introduced.',
            'agents'=>'Reviewed actual AiClient and SecretService changes against agent instructions and role tools: OpenRouter free is optional; the shared deadline and no cross-provider tool replay guard stay enforced.',
            'mail'=>'Reviewed the existing mail and secrets dependency surface. The new model key stays inside encrypted app_secrets and does not change SMTP, email bodies, or credentials.',
            'media'=>'Checked provider and admin view changes against unchanged media upload authorization and media-library code. The OpenRouter field has no file upload or public asset effect.',
            'workflow'=>'Reviewed added isolated MySQL/Playwright fixtures and main CI step; tests use synthetic-only credentials, no real provider calls or secrets and no privileged source checkout scripts.',
            'interface'=>'Cross-reviewed desktop and narrow Integrations UI, Google/compatible selection, masked router key, toggle and update semantics against existing Admin UI and responsive guidelines.',
            'foundation'=>'Reviewed current architecture, runtime guidance and source maps against an optional OpenRouter-compatible route. Existing PHP agents, remoteDB secrets and original provider fallback remain intact.',
            'auth'=>'Reviewed authenticated Integrations controller, CSRF and existing account auth boundaries. The new key remains behind admin-only secret storage and never enters a public route.',
            'public-mcp'=>'Reviewed optional model routing against unchanged public MCP tool schemas and anonymous shopping scope. Chat inference provider selection does not grant WebMCP tools.',
          ];
          $stale=$review->check();
          foreach($stale as $message){
              if(!preg_match('/^([a-z][a-z0-9-]+): source\/doc review missing or stale\./',$message,$match)){
                  fwrite(STDERR,$message."\n");exit(1);
              }
              $area=$match[1];
              if(!isset($notes[$area])){fwrite(STDERR,'Unreviewed documentation area: '.$area."\n");exit(1);}
              $review->record($area,$notes[$area]);
          }
          $errors=$review->check();
          if($errors){fwrite(STDERR,implode("\n",$errors)."\n");exit(1);}
          echo "Reviewed exact source/docs pairs.\n";
          PHP
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh OpenRouter source maps and review receipts [generated]'
          git push origin HEAD:refs/heads/feat/opt-in-openrouter-free-gemma-fallback-20261123
