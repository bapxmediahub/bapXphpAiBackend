name: Issue agent trigger

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create handoff from issue
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          TITLE="${{ github.event.issue.title }}"
          BODY="${{ github.event.issue.body }}"
          cat > .agents/handoffs/${ISSUE_NUMBER}-worker.json << EOF
          {
              "issue": ${ISSUE_NUMBER},
              "role": "worker",
              "trigger": "github-issue-opened",
              "title": $(echo "$TITLE" | jq -Rs .),
              "body": $(echo "$BODY" | jq -Rs '.'),
              "objectives": [
                  {
                      "id": "OBJ-${ISSUE_NUMBER}-1",
                      "status": "gap",
                      "evidence": [],
                      "browser_evidence": [],
                      "unresolved": ["Pending investigation"]
                  }
              ],
              "files_changed": [],
              "commands_run": [],
              "risks": [],
              "next_role": "cto"
          }
          EOF
      - name: Comment handoff ready
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          gh issue comment ${ISSUE_NUMBER} --body \
            "🤖 Sub-agent handoff queued in \`.agents/handoffs/${ISSUE_NUMBER}-worker.json\`. Next CTO session will pick this up via \`bapXphp handoff next ${ISSUE_NUMBER}\`."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
